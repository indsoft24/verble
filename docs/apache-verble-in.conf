# Apache proxy for verble.in -> Verble Docker app
# Port must match docker-compose.vps.yml (web.ports, e.g. 3001:80).
# Copy to server: sudo cp apache-verble-in.conf /etc/httpd/conf.d/verble.in.conf
# Then: sudo apachectl configtest && sudo systemctl reload httpd

<VirtualHost *:80>
    ServerName verble.in
    ServerAlias www.verble.in

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    <Location />
        RequestHeader set X-Forwarded-Proto "http"
        RequestHeader set X-Forwarded-Port "80"
    </Location>
</VirtualHost>
