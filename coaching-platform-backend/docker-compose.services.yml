# Docker Compose for just MongoDB and Redis services
# Use this if you want to run the backend locally

services:
  # MongoDB Database
  mongo:
    image: mongo:latest
    container_name: verble-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=verble
    networks:
      - verble-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/verble --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:latest
    container_name: verble-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - verble-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local

networks:
  verble-network:
    driver: bridge
